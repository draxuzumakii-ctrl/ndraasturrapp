          <thead><tr><th>Judul</th><th>Kategori</th><th>Customer</th><th>Nominal</th><th>Status</th><th>Tanggal</th><th></th></tr></thead>

<!-- ADD/EDIT TX MODAL -->
<div class="modal-overlay" id="tx-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">Tambah Catatan</h3><button class="modal-close" id="modal-close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <form id="tx-form">
      <input type="hidden" id="f-id">
      <div class="field"><label>Judul</label><input type="text" class="input" id="f-judul" placeholder="Contoh: Jual akun FF ready unbind" required></div>
      <div class="input-group">
        <div class="field"><label>Kategori</label><select class="input" id="f-kategori"></select></div>
        <div class="field"><label>Status</label><select class="input" id="f-status"></select></div>
      </div>
      <div class="field"><label>Nama Customer</label><input type="text" class="input" id="f-customer" placeholder="Opsional"></div>
      <div class="input-group">
        <div class="field"><label>Nominal (Rp)</label><input type="number" class="input" id="f-nominal" placeholder="0" min="0" required></div>
        <div class="field"><label>Tanggal</label><input type="date" class="input" id="f-tanggal" required></div>
      </div>
      <div class="field"><label>Catatan</label><textarea class="input" id="f-catatan" placeholder="Catatan tambahan (opsional)"></textarea></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-glass" id="modal-cancel">Batal</button>
        <button type="submit" class="btn btn-primary" id="btn-save-tx">Simpan Catatan</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
<script type="module">
let N;
document.addEventListener('ndraa:ready', () => { N = window.NDRAA; init(); });

function init(){
  document.getElementById('f-kategori').innerHTML = N.CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('f-status').innerHTML = N.TX_STATUS.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('filter-kategori').innerHTML += N.CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('filter-status').innerHTML += N.TX_STATUS.map(s => `<option value="${s}">${s}</option>`).join('');

  const params = new URLSearchParams(location.search);
  if (params.get('new') === '1') openTxModal();
}

const txModal = document.getElementById('tx-modal');
const txForm = document.getElementById('tx-form');

function openTxModal(tx = null){
  txForm.reset();
  if (tx){
    document.getElementById('modal-title').textContent = 'Edit Catatan';
    document.getElementById('f-id').value = tx.id;
    document.getElementById('f-judul').value = tx.judul;
    document.getElementById('f-kategori').value = tx.kategori;
    document.getElementById('f-status').value = tx.status;
    document.getElementById('f-customer').value = tx.customer || '';
    document.getElementById('f-nominal').value = tx.nominal;
    document.getElementById('f-tanggal').value = tx.tanggal;
    document.getElementById('f-catatan').value = tx.catatan || '';
  } else {
    document.getElementById('modal-title').textContent = 'Tambah Catatan';
    document.getElementById('f-id').value = '';
    document.getElementById('f-tanggal').value = new Date().toISOString().split('T')[0];
  }
  txModal.classList.add('open');
}
function closeTxModal(){ txModal.classList.remove('open'); history.replaceState(null,'','catatan.html'); }
document.getElementById('btn-add-tx').addEventListener('click', () => openTxModal());
document.getElementById('fab-add').addEventListener('click', (e) => { e.preventDefault(); openTxModal(); });
document.getElementById('modal-close').addEventListener('click', closeTxModal);
document.getElementById('modal-cancel').addEventListener('click', closeTxModal);
txModal.addEventListener('click', (e) => { if (e.target === txModal) closeTxModal(); });

txForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const data = {
    judul: document.getElementById('f-judul').value.trim(),
    kategori: document.getElementById('f-kategori').value,
    status: document.getElementById('f-status').value,
    customer: document.getElementById('f-customer').value.trim(),
    nominal: Number(document.getElementById('f-nominal').value || 0),
    tanggal: document.getElementById('f-tanggal').value,
    catatan: document.getElementById('f-catatan').value.trim()
  };
  const btn = document.getElementById('btn-save-tx');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    if (id) await N.updateTx(id, data); else await N.createTx(data);
    N.toast(id ? 'Catatan diperbarui' : 'Catatan ditambahkan', 'success');
    closeTxModal();
  }catch(err){ console.error(err); N.toast('Gagal menyimpan catatan', 'error'); }
  finally{ btn.disabled = false; btn.textContent = 'Simpan Catatan'; }
});

/* RENDER */
let allTx = [];
let chartRekap;
document.addEventListener('ndraa:transactions', (e) => { allTx = e.detail; renderAll(); });
['search-input','filter-kategori','filter-status','sort-by'].forEach(id => document.getElementById(id).addEventListener('input', renderTable));

function renderAll(){ renderRekap(); renderTable(); }

function renderRekap(){
  if (!N) return;
  const done = allTx.filter(t => t.status === 'Selesai');
  const sum = (cat) => done.filter(t => t.kategori === cat).reduce((s,t) => s + Number(t.nominal||0), 0);
  const totalPenjualan = sum('Penjualan'), totalMC = sum('MC'), totalJasa = sum('Jasa Admin');
  const totalMasuk = sum('Pemasukan');
  const totalKeluar = sum('Pengeluaran') + sum('Pembelian');
  const totalProfit = totalPenjualan + totalMC + totalJasa + totalMasuk - totalKeluar;
  const pending = allTx.filter(t => t.status === 'Pending').length;
  const selesai = allTx.filter(t => t.status === 'Selesai').length;

  const cards = [
    { label:'Total Penjualan', value:N.formatRupiah(totalPenjualan) },
    { label:'Total MC', value:N.formatRupiah(totalMC) },
    { label:'Total Jasa Admin', value:N.formatRupiah(totalJasa) },
    { label:'Total Pemasukan', value:N.formatRupiah(totalMasuk) },
    { label:'Total Pengeluaran', value:N.formatRupiah(totalKeluar) },
    { label:'Total Profit', value:N.formatRupiah(totalProfit) },
    { label:'Pending', value:pending },
    { label:'Selesai', value:selesai }
  ];
  document.getElementById('rekap-grid').innerHTML = cards.map(c => `
    <div class="card stat-card"><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div>`).join('');

  const now = new Date();
  const labels = [], profitData = [], salesData = [];
  for (let i = 5; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    labels.push(d.toLocaleDateString('id-ID', { month:'short' }));
    const monthTx = done.filter(t => t.createdAt?.toDate && t.createdAt.toDate().getFullYear()===d.getFullYear() && t.createdAt.toDate().getMonth()===d.getMonth());
    profitData.push(monthTx.reduce((s,t) => s + (['Penjualan','MC','Jasa Admin','Pemasukan'].includes(t.kategori)?Number(t.nominal||0):-Number(t.nominal||0)), 0));
    salesData.push(monthTx.filter(t => t.kategori==='Penjualan').reduce((s,t)=>s+Number(t.nominal||0),0));
  }
  if (chartRekap) chartRekap.destroy();
  chartRekap = new Chart(document.getElementById('chart-rekap'), {
    type:'bar',
    data:{ labels, datasets:[
      { label:'Profit', data:profitData, backgroundColor:'#00E5A0', borderRadius:8, maxBarThickness:24 },
      { label:'Penjualan', data:salesData, backgroundColor:'#7B5CFF', borderRadius:8, maxBarThickness:24 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:'#B9B4CC', font:{ size:11 } } } },
      scales:{ x:{ ticks:{ color:'#716C8A' }, grid:{ color:'rgba(255,255,255,0.05)' } }, y:{ ticks:{ color:'#716C8A' }, grid:{ color:'rgba(255,255,255,0.05)' } } } }
  });
}

function renderTable(){
  if (!N) return;
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const fKat = document.getElementById('filter-kategori').value;
  const fStatus = document.getElementById('filter-status').value;
  const sortBy = document.getElementById('sort-by').value;

  let list = [...allTx];
  if (q) list = list.filter(t => (t.judul||'').toLowerCase().includes(q) || (t.customer||'').toLowerCase().includes(q));
  if (fKat) list = list.filter(t => t.kategori === fKat);
  if (fStatus) list = list.filter(t => t.status === fStatus);
  if (sortBy === 'terbaru') list.sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if (sortBy === 'terlama') list.sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  if (sortBy === 'nominal') list.sort((a,b) => Number(b.nominal||0)-Number(a.nominal||0));

  document.getElementById('tx-count-label').textContent = `${list.length} catatan`;
  const tbody = document.getElementById('tx-tbody');
  const emptyDiv = document.getElementById('tx-empty');

  if (!list.length){
    tbody.innerHTML = '';
    emptyDiv.style.display = 'block';
    emptyDiv.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 2h6l5 5v13a2 2 0 01-2 2H9a2 2 0 01-2-2V4a2 2 0 012-2z"/></svg>
      <h4>Belum ada catatan</h4><p>Tambahkan catatan penjualan, MC, atau transaksi lainnya</p>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('btn-add-tx').click()">Tambah Catatan</button>
    </div>`;
    return;
  }
  emptyDiv.style.display = 'none';

  const statusBadgeClass = { 'Pending':'d7', 'Proses':'d1', 'Selesai':'ready', 'Dibatalkan':'bind' };
  tbody.innerHTML = list.map(t => `
    <tr data-id="${t.id}">
      <td>${N.escapeHtml(t.judul)}</td>
      <td><span class="badge neutral">${N.escapeHtml(t.kategori)}</span></td>
      <td>${N.escapeHtml(t.customer || '-')}</td>
      <td class="mono">${N.formatRupiah(t.nominal)}</td>
      <td><span class="badge ${statusBadgeClass[t.status]||'neutral'}">${N.escapeHtml(t.status)}</span></td>
      <td>${N.formatDate(t.tanggal)}</td>
      <td><div style="display:flex;gap:6px;">
        <button class="chip-btn" data-action="edit"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
        <button class="chip-btn" data-action="delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button>
      </div></td>
    </tr>`).join('');

  tbody.querySelectorAll('tr').forEach(row => {
    const id = row.dataset.id;
    const tx = list.find(t => t.id === id);
    row.querySelector('[data-action="edit"]').addEventListener('click', () => openTxModal(tx));
    row.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      const ok = await N.confirmDelete(tx.judul);
      if (ok){ await N.deleteTx(tx.id); N.toast('Catatan berhasil dihapus', 'success'); }
    });
  });
}

document.getElementById('btn-export-json').addEventListener('click', () => N.exportJSON(allTx, `catatan-${Date.now()}.json`));
document.getElementById('btn-export-csv').addEventListener('click', () => N.exportCSV(allTx, `catatan-${Date.now()}.csv`));
</script>
</body>
