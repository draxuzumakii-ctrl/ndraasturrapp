<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Beranda — NDRAA STURR BIND MANAGER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="flex items-center gap-3">
      <button class="btn btn-ghost btn-icon" id="menuToggle" style="display:none;" aria-label="Menu">☰</button>
      <div class="navbar-brand">
        <div class="logo-icon">🔮</div>
        <span class="gradient-text">NDRAA STURR</span>
      </div>
    </div>
    <div class="navbar-actions">
      <span id="navbarGreeting" style="font-size:0.8rem;color:var(--text-muted);"></span>
      <div class="navbar-avatar" id="navbarAvatar" title="Profil">N</div>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
      <li><a href="beranda.html" class="active"><span class="nav-icon">📊</span> Beranda</a></li>
      <li><a href="akun.html"><span class="nav-icon">🔐</span> Akun Bind</a></li>
      <li><a href="catatan.html"><span class="nav-icon">📝</span> Catatan</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <a href="#" id="logoutBtn" class="btn btn-secondary w-full" style="justify-content:center;">🚪 Logout</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="page-header">
      <h1>📊 Beranda</h1>
      <p>Ringkasan bind manager Anda</p>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button class="btn btn-primary btn-sm" onclick="window.location.href='akun.html?action=add'">➕ Tambah Akun</button>
      <button class="btn btn-secondary btn-sm" onclick="window.location.href='catatan.html?action=add'">📝 Tambah Catatan</button>
      <button class="btn btn-secondary btn-sm" id="backupBtn">💾 Backup</button>
      <button class="btn btn-secondary btn-sm" id="refreshBtn">🔄 Refresh</button>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <!-- Charts -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="charts-wrapper">
      <div class="chart-container">
        <h3 style="margin-bottom:12px;">Akun per Game</h3>
        <canvas id="chartGame"></canvas>
      </div>
      <div class="chart-container">
        <h3 style="margin-bottom:12px;">Profit Bulanan</h3>
        <canvas id="chartProfit"></canvas>
      </div>
    </div>

    <!-- Countdown Terdekat -->
    <div class="chart-container mt-4">
      <h3 style="margin-bottom:16px;">⏳ Countdown Terdekat</h3>
      <div id="upcomingCountdowns" style="display:flex;flex-wrap:wrap;gap:12px;">
        <p class="text-muted">Memuat data...</p>
      </div>
    </div>
  </main>

  <!-- Bottom Nav Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="beranda.html" class="active"><span class="bn-icon">📊</span>Beranda</a>
      <a href="akun.html"><span class="bn-icon">🔐</span>Akun</a>
      <a href="catatan.html"><span class="bn-icon">📝</span>Catatan</a>
    </div>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="script.js"></script>
</body>
</html>
