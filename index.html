<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NDRAA STURR BIND MANAGER — Masuk</title>
<meta name="theme-color" content="#08060F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body data-page="auth">
<div class="nebula"></div>

<div class="auth-wrap">
  <div class="auth-card card fade-in">

    <div class="auth-logo">
      <div class="brand-mark">NS</div>
      <div class="auth-title">NDRAA STURR</div>
      <div class="auth-sub">Bind Manager · masuk untuk melanjutkan</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" class="input" id="login-email" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" class="input" id="login-password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-toggle="login-password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);cursor:pointer;">
          <input type="checkbox" id="remember-me" checked style="accent-color:var(--violet);width:15px;height:15px;">
          Ingat saya
        </label>
        <a href="#" id="link-forgot" style="font-size:12.5px;color:var(--violet-soft);font-weight:600;">Lupa password?</a>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="btn-login">
        <span class="btn-text">Masuk</span>
      </button>
      <div class="auth-switch">Belum punya akun? <a href="#" id="link-register">Daftar sekarang</a></div>
    </form>

    <!-- REGISTER FORM -->
    <form id="form-register" style="display:none;">
      <div class="field">
        <label>Nama</label>
        <input type="text" class="input" id="reg-name" placeholder="Nama kamu" required autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" class="input" id="reg-email" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" class="input" id="reg-password" placeholder="Minimal 6 karakter" required autocomplete="new-password" minlength="6">
          <button type="button" class="password-toggle" data-toggle="reg-password">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;" id="btn-register">
        <span class="btn-text">Buat Akun</span>
      </button>
      <div class="auth-switch">Sudah punya akun? <a href="#" id="link-login">Masuk</a></div>
    </form>

    <!-- FORGOT PASSWORD FORM -->
    <form id="form-forgot" style="display:none;">
      <p style="font-size:12.5px;color:var(--text-faint);margin:0 0 16px;">Masukkan email akunmu, kami akan kirim tautan reset password.</p>
      <div class="field">
        <label>Email</label>
        <input type="email" class="input" id="forgot-email" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="btn-forgot">
        <span class="btn-text">Kirim Tautan Reset</span>
      </button>
      <div class="auth-switch"><a href="#" id="link-back-login">← Kembali ke login</a></div>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script type="module">
import {
  auth, setPersistence, browserLocalPersistence, browserSessionPersistence,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, updateProfile, onAuthStateChanged
} from './firebase.js';

const forms = {
  login: document.getElementById('form-login'),
  register: document.getElementById('form-register'),
  forgot: document.getElementById('form-forgot')
};
function showForm(name){
  Object.values(forms).forEach(f => f.style.display = 'none');
  forms[name].style.display = 'block';
  forms[name].classList.add('fade-in');
}
document.getElementById('link-register').addEventListener('click', e => { e.preventDefault(); showForm('register'); });
document.getElementById('link-login').addEventListener('click', e => { e.preventDefault(); showForm('login'); });
document.getElementById('link-forgot').addEventListener('click', e => { e.preventDefault(); showForm('forgot'); });
document.getElementById('link-back-login').addEventListener('click', e => { e.preventDefault(); showForm('login'); });

document.querySelectorAll('.password-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.toggle);
    input.type = input.type === 'password' ? 'text' : 'password';
  });
});

function toast(msg, type){
  const colors = { success:'linear-gradient(135deg,#00E5A0,#3E8EFF)', error:'linear-gradient(135deg,#FF5C7A,#FF8A4C)', default:'linear-gradient(135deg,#7B5CFF,#3E8EFF)' };
  Toastify({ text: msg, duration: 3000, gravity:'top', position:'right', style:{ background: colors[type] || colors.default } }).showToast();
}
function setLoading(btnId, loading, textLoading, textDefault){
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.querySelector('.btn-text').textContent = loading ? textLoading : textDefault;
}
function friendlyError(err){
  const map = {
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/user-not-found': 'Akun dengan email ini tidak ditemukan.',
    'auth/wrong-password': 'Password salah.',
    'auth/invalid-credential': 'Email atau password salah.',
    'auth/email-already-in-use': 'Email sudah terdaftar.',
    'auth/weak-password': 'Password minimal 6 karakter.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.'
  };
  return map[err.code] || 'Terjadi kesalahan. Coba lagi.';
}

forms.login.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const remember = document.getElementById('remember-me').checked;
  setLoading('btn-login', true, 'Memproses...', 'Masuk');
  try{
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    toast('Berhasil masuk!', 'success');
  }catch(err){
    toast(friendlyError(err), 'error');
  }finally{
    setLoading('btn-login', false, 'Memproses...', 'Masuk');
  }
});

forms.register.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  setLoading('btn-register', true, 'Membuat akun...', 'Buat Akun');
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    toast('Akun berhasil dibuat!', 'success');
  }catch(err){
    toast(friendlyError(err), 'error');
  }finally{
    setLoading('btn-register', false, 'Membuat akun...', 'Buat Akun');
  }
});

forms.forgot.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('forgot-email').value.trim();
  setLoading('btn-forgot', true, 'Mengirim...', 'Kirim Tautan Reset');
  try{
    await sendPasswordResetEmail(auth, email);
    toast('Tautan reset password telah dikirim ke email kamu.', 'success');
    showForm('login');
  }catch(err){
    toast(friendlyError(err), 'error');
  }finally{
    setLoading('btn-forgot', false, 'Mengirim...', 'Kirim Tautan Reset');
  }
});

// Redirect if already logged in
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = 'beranda.html';
});
</script>
</body>
</html>
