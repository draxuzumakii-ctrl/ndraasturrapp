<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Akun Bind — NDRAA STURR BIND MANAGER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="flex items-center gap-3">
      <button class="btn btn-ghost btn-icon" id="menuToggle" style="display:none;" aria-label="Menu">☰</button>
      <div class="navbar-brand">
        <div class="logo-icon">🔮</div>
        <span class="gradient-text">NDRAA STURR</span>
      </div>
    </div>
    <div class="navbar-actions">
      <span id="navbarGreeting" style="font-size:0.8rem;color:var(--text-muted);"></span>
      <div class="navbar-avatar" id="navbarAvatar" title="Profil">N</div>
    </div>
  </nav>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-nav">
      <li><a href="beranda.html"><span class="nav-icon">📊</span> Beranda</a></li>
      <li><a href="akun.html" class="active"><span class="nav-icon">🔐</span> Akun Bind</a></li>
      <li><a href="catatan.html"><span class="nav-icon">📝</span> Catatan</a></li>
    </ul>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <a href="#" id="logoutBtn" class="btn btn-secondary w-full" style="justify-content:center;">🚪 Logout</a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <div class="page-header">
      <h1>🔐 Akun Bind</h1>
      <p>Kelola semua akun bind game Anda</p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <input type="text" class="glass-input" id="searchInput" placeholder="🔍 Cari Gmail, UID, Nickname...">
      <select class="glass-select" id="filterGame">
        <option value="">Semua Game</option>
        <option value="Free Fire">Free Fire</option>
        <option value="MLBB">MLBB</option>
        <option value="PUBG">PUBG</option>
        <option value="CODM">CODM</option>
        <option value="Roblox">Roblox</option>
        <option value="Honor Of Kings">Honor Of Kings</option>
        <option value="Arena Breakout">Arena Breakout</option>
        <option value="Blood Strike">Blood Strike</option>
        <option value="Delta Force">Delta Force</option>
        <option value="Lainnya">Lainnya</option>
      </select>
      <select class="glass-select" id="filterStatus">
        <option value="">Semua Status</option>
        <option value="ready">Ready Unbind</option>
        <option value="bind">Masih Bind</option>
      </select>
      <select class="glass-select" id="filterLabel">
        <option value="">Semua Label</option>
        <option value="Ready">Ready</option>
        <option value="Sold">Sold</option>
        <option value="Pribadi">Pribadi</option>
        <option value="Dipakai">Dipakai</option>
        <option value="Dijual">Dijual</option>
      </select>
      <select class="glass-select" id="sortBy">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
        <option value="countdown">Countdown</option>
        <option value="name">Nama Game</option>
      </select>
      <button class="btn btn-primary btn-sm" id="addAccountBtn">➕ Tambah</button>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="viewTabs">
      <button class="tab-btn active" data-view="grid">📱 Grid</button>
      <button class="tab-btn" data-view="calendar">📅 Kalender</button>
    </div>

    <!-- Account Grid -->
    <div class="account-grid" id="accountGrid">
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>

    <!-- Calendar View (hidden) -->
    <div id="calendarView" class="hidden">
      <div class="chart-container">
        <div class="calendar-header">
          <button class="btn btn-secondary btn-sm" id="prevMonth">◀</button>
          <h3 id="calendarMonthTitle"></h3>
          <button class="btn btn-secondary btn-sm" id="nextMonth">▶</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div id="calendarDayDetail" class="mt-3"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">🔐</div>
      <h3>Belum ada akun</h3>
      <p class="text-muted">Tambahkan akun bind pertama Anda</p>
      <button class="btn btn-primary mt-3" id="emptyAddBtn">➕ Tambah Akun</button>
    </div>
  </main>

  <!-- Bottom Nav Mobile -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="beranda.html"><span class="bn-icon">📊</span>Beranda</a>
      <a href="akun.html" class="active"><span class="bn-icon">🔐</span>Akun</a>
      <a href="catatan.html"><span class="bn-icon">📝</span>Catatan</a>
    </div>
  </nav>

  <!-- Modal Tambah/Edit Akun -->
  <div class="modal-overlay hidden" id="accountModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Tambah Akun</h2>
        <button class="modal-close" id="closeModal">✕</button>
      </div>
      <div class="modal-body" id="accountFormBody">
        <!-- Filled by JS -->
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
        <button class="btn btn-secondary" id="cancelModal">Batal</button>
        <button class="btn btn-primary" id="saveAccount">Simpan</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.css">
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="script.js"></script>
</body>
</html>
