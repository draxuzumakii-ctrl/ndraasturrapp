    <form id="account-form">
      <input type="hidden" id="f-id">
      <div class="input-group">
        <div class="field"><label>Game</label><select class="input" id="f-game" required></select></div>
        <div class="field"><label>Bind</label><select class="input" id="f-bind" required></select></div>
      </div>
      <div class="field"><label>Gmail</label><input type="email" class="input" id="f-gmail" placeholder="akun@gmail.com" required></div>

<!-- DETAIL MODAL (view full account, all copy actions) -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal" id="detail-modal-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
<script type="module">
let N;
document.addEventListener('ndraa:ready', () => { N = window.NDRAA; init(); });

function init(){
  // Populate selects
  fillSelect('f-game', N.GAMES);
  fillSelect('f-bind', N.BINDS);
  fillSelect('f-label', N.LABELS);
  document.getElementById('f-durasi').innerHTML = N.DURATIONS.map(d => `<option value="${d.days ?? 'custom'}">${d.label}</option>`).join('');
  document.getElementById('filter-game').innerHTML += N.GAMES.map(g => `<option value="${g}">${g}</option>`).join('');
  document.getElementById('filter-label').innerHTML += N.LABELS.map(l => `<option value="${l}">${l}</option>`).join('');

  document.getElementById('f-durasi').addEventListener('change', (e) => {
    document.getElementById('custom-durasi-wrap').style.display = e.target.value === 'custom' ? 'block' : 'none';
  });

  // deep-link ?new=1
  const params = new URLSearchParams(location.search);
  if (params.get('new') === '1') openAccountModal();
  if (params.get('q')) document.getElementById('search-input').value = params.get('q');

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggle);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });
}

function fillSelect(id, options){
  document.getElementById(id).innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
}

/* ============ MODAL CONTROL ============ */
const accModal = document.getElementById('account-modal');
const accForm = document.getElementById('account-form');

function openAccountModal(account = null){
  accForm.reset();
  document.getElementById('custom-durasi-wrap').style.display = 'none';
  if (account){
    document.getElementById('modal-title').textContent = 'Edit Akun';
    document.getElementById('f-id').value = account.id;
    document.getElementById('f-game').value = account.game;
    document.getElementById('f-bind').value = account.bind;
    document.getElementById('f-gmail').value = account.gmail;
    document.getElementById('f-password').value = account.password;
    document.getElementById('f-uid').value = account.uid || '';
    document.getElementById('f-nickname').value = account.nickname || '';
    document.getElementById('f-server').value = account.server || '';
    document.getElementById('f-tanggal-bind').value = account.tanggalBind;
    document.getElementById('f-label').value = account.label;
    document.getElementById('f-status').value = account.status;
    document.getElementById('f-catatan').value = account.catatan || '';
    const knownDur = N.DURATIONS.find(d => d.days === Number(account.durasiHari));
    if (knownDur && knownDur.days !== null){
      document.getElementById('f-durasi').value = account.durasiHari;
    } else {
      document.getElementById('f-durasi').value = 'custom';
      document.getElementById('custom-durasi-wrap').style.display = 'block';
      document.getElementById('f-durasi-custom').value = account.durasiHari;
    }
  } else {
    document.getElementById('modal-title').textContent = 'Tambah Akun';
    document.getElementById('f-id').value = '';
    document.getElementById('f-tanggal-bind').value = new Date().toISOString().split('T')[0];
  }
  accModal.classList.add('open');
}
function closeAccountModal(){ accModal.classList.remove('open'); history.replaceState(null,'','akun.html'); }
document.getElementById('btn-add-account').addEventListener('click', () => openAccountModal());
document.getElementById('fab-add').addEventListener('click', (e) => { e.preventDefault(); openAccountModal(); });
document.getElementById('modal-close').addEventListener('click', closeAccountModal);
document.getElementById('modal-cancel').addEventListener('click', closeAccountModal);
accModal.addEventListener('click', (e) => { if (e.target === accModal) closeAccountModal(); });

accForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const durasiSel = document.getElementById('f-durasi').value;
  const durasiHari = durasiSel === 'custom' ? Number(document.getElementById('f-durasi-custom').value || 0) : Number(durasiSel);
  const data = {
    game: document.getElementById('f-game').value,
    bind: document.getElementById('f-bind').value,
    gmail: document.getElementById('f-gmail').value.trim(),
    password: document.getElementById('f-password').value,
    uid: document.getElementById('f-uid').value.trim(),
    nickname: document.getElementById('f-nickname').value.trim(),
    server: document.getElementById('f-server').value.trim(),
    tanggalBind: document.getElementById('f-tanggal-bind').value,
    durasiHari,
    label: document.getElementById('f-label').value,
    status: document.getElementById('f-status').value,
    catatan: document.getElementById('f-catatan').value.trim()
  };
  const btn = document.getElementById('btn-save-account');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    if (id) await N.updateAccount(id, data); else await N.createAccount(data);
    N.toast(id ? 'Akun berhasil diperbarui' : 'Akun berhasil ditambahkan', 'success');
    closeAccountModal();
  }catch(err){
    console.error(err); N.toast('Gagal menyimpan akun', 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'Simpan Akun';
  }
});

/* ============ DETAIL MODAL ============ */
function openDetailModal(a){
  const N_ = N;
  const unbind = N_.computeUnbindDate(a.tanggalBind, a.durasiHari);
  const remaining = N_.daysRemaining(unbind);
  document.getElementById('detail-modal-body').innerHTML = `
    <div class="modal-head">
      <h3>${N_.escapeHtml(a.game)} · ${N_.escapeHtml(a.nickname || 'Tanpa nama')}</h3>
      <button class="modal-close" id="detail-close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
      ${N_.ringSvg(remaining, a.durasiHari, 64)}
      <div>${N_.statusBadge(remaining)}<div style="font-size:12px;color:var(--text-faint);margin-top:6px;">Unbind: ${N_.formatDate(unbind)}</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;">
      <div class="acc-row"><span class="k">Bind</span><span class="v">${N_.escapeHtml(a.bind)}</span></div>
      <div class="acc-row"><span class="k">Gmail</span><span class="v mono">${N_.escapeHtml(a.gmail)}</span></div>
      <div class="acc-row"><span class="k">Password</span><span class="v mono masked" id="detail-pass">••••••••</span></div>
      <div class="acc-row"><span class="k">UID</span><span class="v mono">${N_.escapeHtml(a.uid||'-')}</span></div>
      <div class="acc-row"><span class="k">Server</span><span class="v">${N_.escapeHtml(a.server||'-')}</span></div>
      <div class="acc-row"><span class="k">Tanggal Bind</span><span class="v">${N_.formatDate(a.tanggalBind)}</span></div>
      <div class="acc-row"><span class="k">Label</span><span class="v">${N_.escapeHtml(a.label)}</span></div>
      <div class="acc-row"><span class="k">Status</span><span class="v">${N_.escapeHtml(a.status)}</span></div>
      ${a.catatan ? `<div class="acc-note">${N_.escapeHtml(a.catatan)}</div>` : ''}
    </div>
    <div class="modal-foot" style="flex-wrap:wrap;">
      <button class="btn btn-glass btn-sm" id="d-show-pass">Show Password</button>
      <button class="btn btn-glass btn-sm" id="d-copy-gmail">Copy Gmail</button>
      <button class="btn btn-glass btn-sm" id="d-copy-pass">Copy Password</button>
      <button class="btn btn-glass btn-sm" id="d-copy-gp">Copy Gmail+Pass</button>
      <button class="btn btn-glass btn-sm" id="d-copy-all">Copy Semua</button>
      <button class="btn btn-primary btn-sm" id="d-edit">Edit</button>
      <button class="btn btn-danger btn-sm" id="d-delete">Delete</button>
    </div>`;
  document.getElementById('detail-modal').classList.add('open');
  document.getElementById('detail-close').addEventListener('click', closeDetailModal);
  let shown = false;
  document.getElementById('d-show-pass').addEventListener('click', (e) => {
    shown = !shown;
    document.getElementById('detail-pass').textContent = shown ? a.password : '••••••••';
    e.target.textContent = shown ? 'Hide Password' : 'Show Password';
  });
  document.getElementById('d-copy-gmail').addEventListener('click', () => N_.copyText(a.gmail, 'Gmail'));
  document.getElementById('d-copy-pass').addEventListener('click', () => N_.copyText(a.password, 'Password'));
  document.getElementById('d-copy-gp').addEventListener('click', () => N_.copyText(`${a.gmail} | ${a.password}`, 'Gmail + Password'));
  document.getElementById('d-copy-all').addEventListener('click', () => {
    const text = `Game: ${a.game}\nBind: ${a.bind}\nGmail: ${a.gmail}\nPassword: ${a.password}\nUID: ${a.uid||'-'}\nNickname: ${a.nickname||'-'}\nServer: ${a.server||'-'}\nTanggal Bind: ${a.tanggalBind}\nCatatan: ${a.catatan||'-'}`;
    N_.copyText(text, 'Semua data');
  });
  document.getElementById('d-edit').addEventListener('click', () => { closeDetailModal(); openAccountModal(a); });
  document.getElementById('d-delete').addEventListener('click', async () => {
    const ok = await N_.confirmDelete(`${a.game} - ${a.nickname||a.gmail}`);
    if (ok){ await N_.deleteAccount(a.id); N_.toast('Akun berhasil dihapus', 'success'); closeDetailModal(); }
  });
}
function closeDetailModal(){ document.getElementById('detail-modal').classList.remove('open'); }
document.getElementById('detail-modal').addEventListener('click', (e) => { if (e.target.id === 'detail-modal') closeDetailModal(); });

/* ============ RENDER GRID (search/filter/sort) ============ */
let allAccounts = [];
document.addEventListener('ndraa:accounts', (e) => { allAccounts = e.detail; renderGrid(); renderCalendar(); });

['search-input','filter-game','filter-status','filter-label','sort-by'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderGrid);
});

function renderGrid(){
  if (!N) return;
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const fGame = document.getElementById('filter-game').value;
  const fStatus = document.getElementById('filter-status').value;
  const fLabel = document.getElementById('filter-label').value;
  const sortBy = document.getElementById('sort-by').value;

  let list = allAccounts.map(a => {
    const unbind = N.computeUnbindDate(a.tanggalBind, a.durasiHari);
    return { ...a, unbind, remaining: N.daysRemaining(unbind) };
  });

  if (q) list = list.filter(a => (a.gmail||'').toLowerCase().includes(q) || (a.uid||'').toLowerCase().includes(q) || (a.nickname||'').toLowerCase().includes(q));
  if (fGame) list = list.filter(a => a.game === fGame);
  if (fStatus === 'ready') list = list.filter(a => a.remaining <= 0);
  if (fStatus === 'bind') list = list.filter(a => a.remaining > 0);
  if (fLabel) list = list.filter(a => a.label === fLabel);

  if (sortBy === 'terbaru') list.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  if (sortBy === 'terlama') list.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
  if (sortBy === 'countdown') list.sort((a,b) => a.remaining - b.remaining);
  if (sortBy === 'nama') list.sort((a,b) => (a.nickname||'').localeCompare(b.nickname||''));
  if (sortBy === 'game') list.sort((a,b) => a.game.localeCompare(b.game));

  document.getElementById('acc-count-label').textContent = `${list.length} akun`;
  const grid = document.getElementById('acc-grid');

  if (!list.length){
    grid.innerHTML = `<div class="card empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 9h20"/></svg>
      <h4>Tidak ada akun ditemukan</h4><p>Coba ubah pencarian atau filter, atau tambahkan akun baru</p>
      <button class="btn btn-primary btn-sm" onclick="document.getElementById('btn-add-account').click()">Tambah Akun</button>
    </div>`;
    return;
  }

  grid.innerHTML = list.map(a => `
    <div class="card acc-card" data-id="${a.id}">
      <div class="acc-head">
        <div class="game-icon">${N.GAME_INITIALS[a.game] || '?'}</div>
        <div class="acc-title"><div class="game-name">${N.escapeHtml(a.game)}</div><div class="bind-type">${N.escapeHtml(a.bind)}</div></div>
        ${N.ringSvg(a.remaining, a.durasiHari)}
      </div>
      <div class="acc-body">
        <div class="acc-row"><span class="k">Gmail</span><span class="v mono">${N.escapeHtml(a.gmail)}</span></div>
        <div class="acc-row"><span class="k">Password</span><span class="v mono masked">••••••••</span></div>
        <div class="acc-row"><span class="k">Nickname</span><span class="v">${N.escapeHtml(a.nickname || '-')}</span></div>
        <div class="acc-row"><span class="k">Unbind</span><span class="v">${N.formatDate(a.unbind)}</span></div>
      </div>
      ${a.catatan ? `<div class="acc-note">${N.escapeHtml(a.catatan)}</div>` : ''}
      <div class="acc-foot">
        ${N.statusBadge(a.remaining)}
        <div class="acc-actions">
          <button class="chip-btn" data-copy="gmail" title="Copy Gmail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
          <button class="chip-btn" data-copy="all" title="Copy Semua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6l5 5v13a2 2 0 01-2 2H9a2 2 0 01-2-2V4a2 2 0 012-2z"/></svg></button>
          <button class="chip-btn" data-action="detail" title="Detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></button>
          <button class="chip-btn" data-action="edit" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
          <button class="chip-btn" data-action="delete" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button>
        </div>
      </div>
    </div>`).join('');

  grid.querySelectorAll('.acc-card').forEach(card => {
    const id = card.dataset.id;
    const account = list.find(a => a.id === id);
    card.querySelector('[data-copy="gmail"]').addEventListener('click', () => N.copyText(account.gmail, 'Gmail'));
    card.querySelector('[data-copy="all"]').addEventListener('click', () => {
      const text = `Game: ${account.game}\nBind: ${account.bind}\nGmail: ${account.gmail}\nPassword: ${account.password}\nUID: ${account.uid||'-'}\nNickname: ${account.nickname||'-'}`;
      N.copyText(text, 'Semua data');
    });
    card.querySelector('[data-action="detail"]').addEventListener('click', () => openDetailModal(account));
    card.querySelector('[data-action="edit"]').addEventListener('click', () => openAccountModal(account));
    card.querySelector('[data-action="delete"]').addEventListener('click', async () => {
      const ok = await N.confirmDelete(`${account.game} - ${account.nickname||account.gmail}`);
      if (ok){ await N.deleteAccount(account.id); N.toast('Akun berhasil dihapus', 'success'); }
    });
  });
}

/* ============ CALENDAR VIEW ============ */
let calDate = new Date();
document.getElementById('btn-toggle-calendar').addEventListener('click', () => {
  const panel = document.getElementById('calendar-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') renderCalendar();
});
document.getElementById('cal-prev').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
document.getElementById('cal-next').addEventListener('click', () => { calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });

function renderCalendar(){
  if (!N) return;
  const dowRow = document.getElementById('cal-dow-row');
  dowRow.innerHTML = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  document.getElementById('cal-month-label').textContent = calDate.toLocaleDateString('id-ID', { month:'long', year:'numeric' });

  const year = calDate.getFullYear(), month = calDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date();

  // map date-string -> accounts ready that day
  const readyMap = {};
  allAccounts.forEach(a => {
    const unbind = N.computeUnbindDate(a.tanggalBind, a.durasiHari);
    const key = unbind.toISOString().split('T')[0];
    readyMap[key] = readyMap[key] || [];
    readyMap[key].push(a);
  });

  let cells = '';
  for (let i = 0; i < firstDay; i++) cells += `<div class="cal-cell muted"></div>`;
  for (let d = 1; d <= daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const key = dateObj.toISOString().split('T')[0];
    const isToday = dateObj.toDateString() === today.toDateString();
    const hasReady = readyMap[key] && readyMap[key].length;
    cells += `<div class="cal-cell ${isToday?'today':''}" data-date="${key}"><span>${d}</span>${hasReady ? '<span class="cal-badge"></span>' : ''}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;

  document.querySelectorAll('#cal-grid .cal-cell[data-date]').forEach(cell => {
    cell.addEventListener('click', () => {
      const key = cell.dataset.date;
      const accs = readyMap[key] || [];
      const detail = document.getElementById('cal-day-detail');
      if (!accs.length){ detail.innerHTML = `<p style="font-size:12.5px;color:var(--text-faint);">Tidak ada akun ready unbind pada tanggal ini.</p>`; return; }
      detail.innerHTML = `<div style="font-size:12.5px;color:var(--text-faint);margin-bottom:10px;">Ready unbind pada ${N.formatDate(key)}:</div>
        <div class="acc-grid">` + accs.map(a => `
          <div class="card acc-card" style="padding:14px;">
            <div class="acc-head"><div class="game-icon">${N.GAME_INITIALS[a.game]||'?'}</div>
            <div class="acc-title"><div class="game-name">${N.escapeHtml(a.game)}</div><div class="bind-type">${N.escapeHtml(a.nickname||a.gmail)}</div></div></div>
          </div>`).join('') + `</div>`;
    });
  });
}

/* ============ EXPORT / IMPORT ============ */
document.getElementById('btn-export-json').addEventListener('click', () => N.exportJSON(allAccounts, `akun-${Date.now()}.json`));
document.getElementById('btn-export-csv').addEventListener('click', () => N.exportCSV(allAccounts, `akun-${Date.now()}.csv`));
document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try{
    const text = await file.text();
    const rows = JSON.parse(text);
    for (const row of rows){ const { id, createdAt, updatedAt, ...rest } = row; await N.createAccount(rest); }
    N.toast(`${rows.length} akun berhasil diimport`, 'success');
  }catch(err){ N.toast('Format file tidak valid', 'error'); }
  e.target.value = '';
});
</script>
